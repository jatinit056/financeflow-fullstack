name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: API — lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/financeflow_test
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      JWT_EXPIRES_IN: 1h
      BCRYPT_ROUNDS: '4'
      RATE_LIMIT_ENABLED: 'false'
      DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prisma validate
      - run: npm test

  client:
    name: Web — lint, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      # The GitHub Pages demo reuses the API's validation schemas (server/src), which need zod.
      - run: npm ci --ignore-scripts
        working-directory: server
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:pages
